<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Caro</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f1e7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f1e7;--panel:#fffaf0;--line:#d6c8aa;--text:#2b2418;--sub:#7a6e58;--x:#d64545;--o:#2f6fd6;--win:#ffe08a;--last:#efe3c3;--btn:#2b2418;--btnt:#fffaf0;--bd:#e0d3b6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17150f;--panel:#221f16;--line:#40392a;--text:#f1e9d6;--sub:#a89d84;--x:#ff7a7a;--o:#7aa8ff;--win:#6b5a1c;--last:#332e20;--btn:#f1e9d6;--btnt:#17150f;--bd:#3a3426}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overscroll-behavior:none;touch-action:manipulation}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2{margin:0;text-align:center}
button{font:inherit;background:var(--btn);color:var(--btnt);border:0;border-radius:10px;padding:11px 16px;cursor:pointer}
button.alt{background:transparent;color:var(--text);border:1px solid var(--bd)}
button.big{font-size:1.1rem;padding:15px}
input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}
.screen{display:none;height:100%;flex-direction:column;padding:12px;max-width:720px;margin:0 auto}
.screen.on{display:flex}
.center{justify-content:center;gap:12px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:12px}
.profile{display:flex;gap:12px;align-items:center}
.profile>div:last-child{flex:1}
.sub{color:var(--sub);font-size:.85rem;margin-top:4px}
.msg{min-height:1.4em;text-align:center;color:var(--sub);font-size:.9rem}
.av{width:40px;height:40px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;border:1px solid var(--bd)}
.av.lg{width:56px;height:56px;font-size:32px;padding:0;color:inherit}
.avpick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.avpick button{background:var(--panel);color:inherit;border:1px solid var(--bd);font-size:24px;padding:6px 10px}
#lbList{list-style:none;margin:8px 0;padding:0;overflow:auto;flex:1}
#lbList li{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid var(--bd)}
#lbList li.me{background:var(--last);border-radius:8px}
#lbList .rk{width:2rem;text-align:center;font-weight:700}
#lbList .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#game{max-width:900px;padding:8px}
#top{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:8px}
.pl{position:relative;display:flex;align-items:center;gap:8px;padding:8px;border:2px solid var(--bd);border-radius:12px;background:var(--panel);overflow:hidden;min-width:0}
.pl.r{flex-direction:row-reverse;text-align:right}
.pl.act{border-color:var(--text)}
.info{min-width:0;display:flex;flex-direction:column;flex:1}
.info b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
.info span{font-size:.8rem;color:var(--sub)}
.sym{font-style:normal;font-weight:800;font-size:1.2rem}
.tbar{position:absolute;left:0;bottom:0;height:4px;width:100%}
.tbar u{display:block;height:100%;width:0;text-decoration:none}
#tm{font-size:1.6rem;font-weight:800;min-width:2.2rem;text-align:center}
#tm.low{color:var(--x)}
#cw{position:relative;flex:1;min-height:0;border:1px solid var(--bd);border-radius:12px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ctl{display:flex;gap:8px;margin-top:8px;justify-content:center}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:16px;z-index:5}
.modal.on{display:flex}
.modal .card{text-align:center;display:flex;flex-direction:column;gap:12px;min-width:min(300px,100%)}
.row{display:flex;gap:8px;justify-content:center}
#upd{display:none;position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9}
</style>
</head>
<body>

<section id="menu" class="screen on center">
  <h1>Game Caro</h1>
  <div class="card profile">
    <button id="avBtn" class="av lg" title="Đổi avatar">😎</button>
    <div><input id="nameIn" maxlength="16" placeholder="Tên của bạn"><div class="sub" id="eloLine">Elo: chưa có (vào Online để nhận)</div></div>
  </div>
  <div id="avPick" class="avpick" hidden></div>
  <button class="big" id="bOnline">🌐 Chơi Online</button>
  <button class="big alt" id="bOffline">📴 Chơi Offline</button>
  <button class="big alt" id="bLb">🏆 Bảng xếp hạng</button>
  <div id="menuMsg" class="msg"></div>
</section>

<section id="offline" class="screen center">
  <h2>Chơi Offline</h2>
  <button class="big" id="bAI">🤖 Chơi với máy</button>
  <button class="big" id="bPVP">👥 2 người, chung máy</button>
  <button class="big alt" data-back>← Quay lại</button>
</section>

<section id="lobby" class="screen center">
  <h2>Đang tìm đối thủ…</h2>
  <div class="msg">Bạn bè đang online sẽ được ghép với bạn. Nếu chưa có ai, hãy rủ thêm người vào chơi.</div>
  <button class="big alt" id="bCancel">Hủy</button>
</section>

<section id="lb" class="screen">
  <h2>🏆 Bảng xếp hạng</h2>
  <ol id="lbList"></ol>
  <div id="lbMsg" class="msg"></div>
  <button class="big alt" data-back>← Quay lại</button>
</section>

<section id="game" class="screen">
  <div id="top">
    <div class="pl" id="pL"><div class="av" id="avL"></div><div class="info"><b id="nL"></b><span id="eL"></span></div><i class="sym" id="syL"></i><div class="tbar"><u></u></div></div>
    <div id="tm">30</div>
    <div class="pl r" id="pR"><div class="av" id="avR"></div><div class="info"><b id="nR"></b><span id="eR"></span></div><i class="sym" id="syR"></i><div class="tbar"><u></u></div></div>
  </div>
  <div id="cw"><canvas id="cv"></canvas></div>
  <div id="ctl">
    <button class="alt" id="zOut">−</button>
    <button class="alt" id="zIn">+</button>
    <button class="alt" id="zCen">⌖ Giữa</button>
    <button class="alt" id="bLeave">Thoát</button>
  </div>
</section>

<div class="modal" id="modal"><div class="card"><h2 id="mt"></h2><div id="mp"></div><div class="row"><button id="mAgain">Chơi lại</button><button class="alt" id="mMenu">Về menu</button></div></div></div>
<button id="upd">Có bản mới – bấm để cập nhật</button>

<script src="app.js"></script>
</body>
</html>
